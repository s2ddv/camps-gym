<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Camps</title>
    <link rel="stylesheet" href="/frontend/src/style/register.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
    <div class="container">
                <div class="img-section">  
                    <a href="/frontend/src/pages/index.html">
                        <img src="/frontend/src/assets/register-img.png">
                    </a>
                </div>
            <div class="form-section">
                <div class="form-content">
                <form>
                    <div class="welcome">
                        <h2>BEM-VINDO!</h2>
                        <p>Coloque seus dados pessoais para criar sua conta</p>
                    </div>

                    <label for="primeiro_nome">Primeiro Nome</label>
                        <input type="text" name="primeiro_nome" required>
                    <label for="ultimo_nome">Último Nome</label>
                    <label for="data_nascimento">Data de Nascimento</label>
                        <input type="date"
                        id="data_nascimento"
                        name="data_nascimento"
                        required>
                    <label for="email">Email</label>
                        <input type="email" 
                        id="email"
                        name="email" 
                        required>
                    <label for="telefone">Telefone</label>
                        <input type="tel"
                        name="telefone"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                        pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
                        required>
                    <label for="senha">Senha</label>
                        <input type="password"
                        id="senha"
                        name="senha"
                        required>
                    
                    <label></label>
                    <button type="submit" class="log-in-btn">Login</button>

                    <div class="divider">ou entre com</div>

                    <div class="social-login">
                        <button class="google-btn">
                            
                        </button>
                        <button class="apple-btn">
                            
                        </button>
                    </div>
                    <p class="register">Não tem uma conta ainda?<a href="/frontend/src/pages/register.html"> Registre-se</a></p>
                </div>
                </form>
            </div>
    </div>
</body>
</html>
