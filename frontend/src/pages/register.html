<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Camps</title>
    <link rel="stylesheet" href="/frontend/src/style/register.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
    <div class="container">
                <div class="img-section">  
                    <a href="/frontend/src/pages/index.html">
                        <img src="/frontend/src/assets/register-img.png">
                    </a>
                </div>
            <div class="form-section">
                <div class="form-content">
                <form id="registerForm">
                    <div class="welcome">
                        <h2>BEM-VINDO!</h2>
                        <p>Coloque seus dados pessoais para criar sua conta</p>
                    </div>

                    <!-- CAMPOS DO USUARIO -->
                    <label for="first_name">Primeiro Nome</label>
                    <input type="text" id="first_name" name="first_name" required>

                    <label for="last_name">Último Nome</label>
                    <input type="text" id="last_name" name="last_name" required>

                    <label for="data_de_nascimento">Data de Nascimento</label>
                    <input type="date" id="data_de_nascimento" name="data_de_nascimento" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="telefone">Telefone</label>
                    <input type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
                        required>

                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>

                    <label for="foco">Foco</label>
                        <select id="foco" name="foco" required>
                            <option value="hipertrofia">Hipertrofia</option>
                            <option value="condicionamento">Condicionamento Físico</option>
                            <option value="emagrecimento">Emagrecimento</option>
                        </select>

                    <label for="altura">Altura (m)</label>
                    <input type="number" step="0.01" id="altura" name="altura" placeholder="1.75" required>

                    <label for="peso">Peso (kg)</label>
                    <input type="number" step="0.1" id="peso" name="peso" placeholder="75.5" required>

                    <button type="submit" class="log-in-btn">Registrar</button>

                    <p class="register">
                        Já tem conta?
                        <a href="/frontend/src/pages/login.html"> Entrar</a>
                    </p>
                </form>
            </div>
    </div>
<script src="/frontend/src/lib/forms/register.js"></script>
</body>
</html>
