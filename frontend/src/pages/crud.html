<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Produto</title>
  <link rel="stylesheet" href="../style/crud.css">
</head>
<body>
  <div class="container">
    <!-- Mensagem de sucesso -->
    <div id="successMessage" class="success-message">
      Produto cadastrado com sucesso!
    </div>

    <!-- Lado esquerdo com imagem -->
    <div class="left-section">
      <div class="overlay"></div>
      <img src="../assets/fotocadastroprodutos.jpg" alt="Foto à esquerda">
    </div>

    <!-- Lado direito com formulário -->
    <div class="right-section">
      <h1>CADASTRAR PRODUTO</h1>
      <p>Adicione as informações do produto para disponibilizá-lo na loja.</p>

      <form id="formProduto" class="form-produto">
        <div class="form-group">
          <label for="nome">Nome do Produto</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Garrafa Esportiva" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoria</label>
          <select id="categoria" name="categoria" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="roupas">Roupas</option>
            <option value="acessorios">Acessórios</option>
            <option value="suplementos">Suplementos</option>
            <option value="outros">Outros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" placeholder="Ex: 59.90" required>
        </div>

        <div class="form-group">
          <label for="cor">Cor</label>
          <textarea id="cor" name="cor" rows="1" placeholder="Cor dominante no produto" required></textarea>
        </div>

        <div class="form-group">
          <label for="tamanho">Tamanho</label>
          <select id="tamanho" name="tamanho" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="P">P</option>
            <option value="M">M</option>
            <option value="G">G</option>
            <option value="GG">GG</option>
            <option value="500ml">500ml</option>
            <option value="Regulável">Regulável</option>
          </select>
        </div>

        <div class="form-group">
          <label for="imagem">Imagem do Produto</label>
          <input type="file" id="imagem" name="imagem" accept="image/*" required>
        </div>

        <button type="submit" class="btn-cadastrar">Cadastrar</button>
      </form>

      <a href="../pages/products-list.html" class="voltar">← Voltar à loja</a>
    </div>
  </div>
<style>
    .success-message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s ease;
      z-index: 1000;
    }

    .success-message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
  <script>
    const form = document.getElementById('formProduto');
    const successMessage = document.getElementById('successMessage');
    form.addEventListener('submit', function(event) {
      event.preventDefault(); 
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
      form.reset();
    });
  </script>
</body>
</html>
